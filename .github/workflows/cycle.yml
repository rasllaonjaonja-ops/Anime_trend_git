name: Cycle automatique

on:
  schedule:
    - cron: "17 * * * *"        # toutes les heures (à :17, pour éviter l'heure pile très chargée)
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer un cycle maintenant (ignore l'intervalle de 5 h)"
        type: boolean
        default: false
      sites:
        description: "Sites manga/anime à détecter (séparés par des espaces)"
        type: string
        default: ""
      reject_id:
        description: "ID d'une publication à rejeter (facultatif)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lancer le cycle
        run: node scripts/run-cycle.mjs
        env:
          FORCE: ${{ inputs.force }}
          SITES: ${{ inputs.sites }}
          REJECT_ID: ${{ inputs.reject_id }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
      - name: Enregistrer les données
        run: |
          git config user.name "anime-trend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Cycle du $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
          
