name: Anime Trend - Cycle automatique

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install

      - name: Exécuter le cycle
        run: npm run cycle

**Important :** le code ci-dessus suppose que ton `package.json` contient bien un script nommé `cycle`. Nous vérifierons cela si le workflow échoue encore.

## Étape 3 — Enregistrer

1. Descends en bas de l’éditeur.
2. Appuie sur **Commit changes**.
3. Confirme avec **Commit changes**.

Cela enregistre la correction et déclenche normalement une nouvelle exécution.

## Étape 4 — Vérifier

Retourne dans **Actions**, puis ouvre la nouvelle exécution de `cycle.yml`.

- ✅ **Coche verte** : cette erreur de déclenchement est corrigée.
- ❌ **Croix rouge** : ouvre l’exécution et envoie-moi le nouveau message d’erreur.

### Attention à deux points

- Le cycle est programmé toutes les cinq heures, mais GitHub Actions ne garantit pas une exécution à la minute exacte.
- **La publication Facebook n’est pas automatiquement configurée par cette correction.** Il faudra vérifier les secrets Facebook et le code de publication avant de considérer le système comme entièrement automatique.
